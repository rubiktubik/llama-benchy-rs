[package]
name = "rust-benchy"
version = "0.1.0"
edition = "2024"
description = "Benchmark OpenAI-compatible LLM endpoints"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
dirs = "6"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-stream = "0.3"
axum = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
